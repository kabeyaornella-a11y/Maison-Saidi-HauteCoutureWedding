[build]
command = "npm run build"
publish = "dist"

# VITE_CLIENT_ID doit être défini dans Netlify > Site settings > Environment variables
# pour chaque site (un site Netlify = un client). Voir CLIENTS.md.

[[headers]]
for = "/clients/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
